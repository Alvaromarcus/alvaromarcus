<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {%- if page.ref %}
    {%- assign siblings = site.posts | where: "ref", page.ref -%}
    {%- for sibling in siblings %}
  <link rel="alternate" hreflang="{{ site.data.i18n[sibling.lang].locale }}" href="{{ sibling.url | absolute_url }}">
    {%- endfor -%}
  {%- endif %}
  {%- comment -%} Evita o "flash" branco antes do CSS aplicar o tema salvo {%- endcomment -%}
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved) { document.documentElement.setAttribute('data-theme', saved); }
      } catch (e) {}
    })();
  </script>
  {%- seo -%}
</head>

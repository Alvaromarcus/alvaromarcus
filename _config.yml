# ---------------------------------------------------------------
# Configuracao do site. Editar aqui muda o site inteiro.
# ---------------------------------------------------------------
title: "System Log"
description: "Automação, sistemas embarcados, IA aplicada à indústria e alguns hobbies."
author: "Álvaro Marcus"
image: /assets/images/blog-cover.png
logo: /assets/images/blog-cover.png

url: "https://alvaromarcus.github.io"
baseurl: "/alvaromarcus"

# Idioma padrao do site (usado quando o arquivo nao declara `lang`)
lang: pt

# Links do rodape / cabecalho
email: alvaromarcus.projetos@gmail.com
github_user: Alvaromarcus
linkedin_user: alvaromarcus

twitter:
  username: alvaromarcus

social:
  name: Álvaro Marcus
  links:
    - https://www.linkedin.com/in/alvaromarcus/
    - https://github.com/Alvaromarcus

# ---------------------------------------------------------------
# Posts
# ---------------------------------------------------------------
# Mantem as URLs antigas: /blog/aerobuilder/ e /blog/aerobuilder-en/
permalink: /blog/:title/

defaults:
  # Regra geral: qualquer pagina sem layout declarado vira "page" em portugues
  - scope:
      path: ""
    values:
      layout: "page"
      lang: "pt"
  # Regra mais especifica: posts usam o layout "post"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "pt"

# ---------------------------------------------------------------
# Plugins (todos suportados nativamente pelo GitHub Pages)
# ---------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap

feed:
  path: feed.xml

sass:
  style: compressed

exclude:
  - README.md
  - README-EN.md
  - ESCREVENDO.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - _templates
